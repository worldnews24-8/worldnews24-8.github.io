
name: Update World News RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch RSS news
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          feeds = {
              "भारत": "https://news.google.com/rss?hl=mr&gl=IN&ceid=IN:mr",
              "महाराष्ट्र": "https://news.google.com/rss/search?q=Maharashtra&hl=mr&gl=IN&ceid=IN:mr",
              "जग": "https://news.google.com/rss/headlines/section/topic/WORLD?hl=mr&gl=IN&ceid=IN:mr",
              "व्यवसाय": "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=mr&gl=IN&ceid=IN:mr",
              "क्रीडा": "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=mr&gl=IN&ceid=IN:mr"
          }

          news = []
          for category, url in feeds.items():
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(request, timeout=20).read()
                  root = ET.fromstring(data)
                  for item in root.findall("./channel/item")[:10]:
                      news.append({
                          "category": category,
                          "title": item.findtext("title", ""),
                          "link": item.findtext("link", ""),
                          "description": item.findtext("description", ""),
                          "pubDate": item.findtext("pubDate", "")
                      })
              except Exception as error:
                  print(f"{category}: {error}")

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump({
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "news": news
              }, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(news)} news items")
          PY

      - name: Commit news.json
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "Update automatic news"
            git push
          else
            echo "No news changes"
          fi
          
