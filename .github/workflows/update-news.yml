name: Update World News 24

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest news
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          feeds = [
              ("भारत", "India national news when:1d"),
              ("महाराष्ट्र", "Maharashtra news when:1d"),
              ("जग", "World international news when:1d"),
              ("व्यापार", "India business economy markets when:1d"),
              ("तंत्रज्ञान", "technology science AI news when:1d"),
              ("क्रीडा", "India sports cricket news when:1d")
          ]

          news = []
          seen = set()

          for category, query in feeds:
              url = "https://news.google.com/rss/search?q=" + urllib.parse.quote(query) + "&hl=mr&gl=IN&ceid=IN:mr"
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item")[:10]:
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      date = item.findtext("pubDate", "").strip()
                      desc = item.findtext("description", "").strip()

                      if title and link and link not in seen:
                          seen.add(link)
                          source = item.find("source")
                          news.append({
                              "category": category,
                              "title": title,
                              "link": link,
                              "description": desc,
                              "pubDate": date,
                              "source": source.text if source is not None else "Google News"
                          })
              except Exception as error:
                  print("Feed error:", category, str(error))

          if news:
              data = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "news": news
              }
              with open("news.json", "w", encoding="utf-8") as file:
                  json.dump(data, file, ensure_ascii=False, indent=2)
              print("Updated articles:", len(news))
          else:
              print("No fresh feed data. Keeping previous news.json.")
          PY

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (
            git commit -m "Automatically update latest news"
            git push
          )
          
