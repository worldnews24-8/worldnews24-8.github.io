
name: Update World News RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Marathi news RSS
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape

          feeds = [
              ("भारत", "भारत बातम्या"),
              ("महाराष्ट्र", "महाराष्ट्र बातम्या"),
              ("जग", "World news"),
              ("व्यापार", "India business news"),
              ("तंत्रज्ञान", "technology news"),
              ("क्रीडा", "India sports news")
          ]

          items = []
          for category, query in feeds:
              try:
                  params = urllib.parse.urlencode({
                      "q": query + " when:1d",
                      "hl": "mr",
                      "gl": "IN",
                      "ceid": "IN:mr"
                  })
                  url = "https://news.google.com/rss/search?" + params
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  root = ET.fromstring(
                      urllib.request.urlopen(req, timeout=25).read()
                  )
                  for item in root.findall("./channel/item"):
                      title = unescape(item.findtext("title", ""))
                      title = re.sub("<[^>]+>", "", title).strip()
                      link = item.findtext("link", "")
                      if title and link.startswith("https://"):
                          items.append({
                              "cat": category,
                              "title": title,
                              "link": link,
                              "date": item.findtext("pubDate", ""),
                              "desc": "",
                              "source": "Google News"
                          })
              except Exception as e:
                  print(category, "feed error:", str(e))

          unique = []
          seen = set()
          for item in items:
              if item["link"] not in seen:
                  seen.add(item["link"])
                  unique.append(item)

          if not unique:
              raise SystemExit("No news received; keeping previous news.json")

          data = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "items": unique
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("News updated:", len(unique))
          PY

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automatic news"
            git push
          fi
          
